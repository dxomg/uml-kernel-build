name: Publish UML & Networking Tools Release

on:
  # Automatically release when the kernel workflow finishes successfully
  workflow_run:
    workflows: ["UML Kernel — LTS latest (VECTOR/VDE)"]
    types:
      - completed
    branches:
      - main

  # Allow manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0 or leave blank for date-based tag)'
        required: false
        type: string

jobs:
  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to create/publish releases
      actions: read    # Required to download artifacts across workflows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        run: |
          # Set Tag Name (Defaults to vYYYY.MM.DD-buildNumber if omitted)
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Fetch Latest Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ./tmp-kernel ./tmp-tools

          echo "[+] Finding latest successful kernel build..."
          KERNEL_RUN_ID=$(gh run list --repo "$REPO" --workflow "UML Kernel — LTS latest (VECTOR/VDE)" --status success --limit 1 --json databaseId -q '.[0].databaseId')

          if [ -z "$KERNEL_RUN_ID" ]; then
            echo "::error::No successful run found for 'UML Kernel — LTS latest (VECTOR/VDE)'"
            exit 1
          fi

          echo "[+] Downloading artifacts from Kernel Run ID: $KERNEL_RUN_ID"
          gh run download "$KERNEL_RUN_ID" --repo "$REPO" --dir ./tmp-kernel

          echo "[+] Finding latest successful static binaries build..."
          TOOLS_RUN_ID=$(gh run list --repo "$REPO" --workflow "Build Static Binaries (slirp + vde_plug)" --status success --limit 1 --json databaseId -q '.[0].databaseId')

          if [ -z "$TOOLS_RUN_ID" ]; then
            echo "::error::No successful run found for 'Build Static Binaries (slirp + vde_plug)'"
            exit 1
          fi

          echo "[+] Downloading artifacts from Tools Run ID: $TOOLS_RUN_ID"
          gh run download "$TOOLS_RUN_ID" --repo "$REPO" --dir ./tmp-tools

      - name: Organize Release Binaries
        run: |
          mkdir -p ./release-assets

          echo "=== Downloaded Files Structure ==="
          find ./tmp-kernel ./tmp-tools -type f

          # Locate and copy target files regardless of subfolder nesting
          find ./tmp-kernel -type f -name "linux-uml" -exec cp {} ./release-assets/ \;
          find ./tmp-kernel -type f -name "VERSION" -exec cp {} ./release-assets/ \;
          find ./tmp-tools -type f -name "slirp" -exec cp {} ./release-assets/ \;
          find ./tmp-tools -type f -name "slirp.yaml" -exec cp {} ./release-assets/ \;
          find ./tmp-tools -type f -name "vde_plug" -exec cp {} ./release-assets/ \;

          echo "=== Staged Release Assets ==="
          ls -lh ./release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          
          # Extract kernel version info if available
          K_VERSION="Latest LTS"
          if [ -f ./release-assets/VERSION ]; then
            K_VERSION=$(cat ./release-assets/VERSION)
          fi

          gh release create "$TAG" ./release-assets/* \
            --title "UML Kernel & Networking Suite ($TAG)" \
            --notes "### Included Binaries
          * **\`linux-uml\`**: Kernel build for **${K_VERSION}**
          * **\`slirp\`**: Static slirp binary with enlarged DHCP pool
          * **\`vde_plug\`**: Static vde_plug binary with VECTOR transport support" \
            --generate-notes
